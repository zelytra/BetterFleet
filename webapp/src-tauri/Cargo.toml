[package]
name = "better_fleet"
version = "2.4.4"
description = "A better fleet creator"
authors = ["Zelytra <zelytra@users.noreply.github.com>", "dadodasyra"]
license = ""
repository = ""
default-run = "better_fleet"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# The Tauri-free capture core (#726): FlowStat, the aggregator/ranking and the Linux AF_PACKET
# capture, shared with the privilege-separated betterfleet-netcap helper. Re-exported as
# `better_fleet::capture` by src/lib.rs. The GUI depends on it; it never depends on the GUI, which is
# what keeps Tauri out of the helper's dependency graph.
better_fleet_netcap = { path = "netcap" }
# Tauri v2 (migrated for the Linux port, #735). The v1 allowlist features are gone: window ops are
# core, and global-shortcut / http / shell / updater are plugins (below). Permissions are granted
# per-window under capabilities/.
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
# Relaunch the app after an update installs (the updater flow's final step).
tauri-plugin-process = "2"
tauri-plugin-http = "2"
# Clipboard writes through Rust: WebKitGTK's async Clipboard API rejects on Linux (field report),
# so the webview API can never be the only path.
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
# Loopback OAuth server for the sign-in on every platform. It began as the Linux path (#740): the
# WebKitGTK webview's tauri://localhost origin cannot be an OIDC redirect target, since webviews
# block redirects to non-HTTP(S) schemes. It is now the flow everywhere - the hosted Keycloak login
# opens in the system browser with an http://localhost:<port> redirect that this captures - so the
# refresh token is persisted by the app rather than living in a webview cookie.
tauri-plugin-oauth = "2"
anyhow = "1.0.80"
tokio = { version = "1.43.1", features = ["full"] }
hostname = "0.4.0"
sysinfo = "0.30.6"
netstat2 = "0.11"
idna = "1.0.3"
log = "^0.4"
tauri-plugin-log = { version = "2", features = ["colored"] }
lazy_static = "1.4.0"
# Native audio for the launch-countdown sound (#671): webview audio is suspended when the window is
# occluded behind the game, native playback is not.
rodio = "0.20.1"
# Discord Rich Presence over the local client's IPC (#684): no bot, no OAuth.
discord-rich-presence = "0.2.5"

# winapi backs the Windows-only native pieces. Only `winuser` now - the Sea of Thieves window
# focus/click (window_interaction.rs, main.rs): the promiscuous capture socket and its
# WSAIoctl(SIO_RCVALL) moved into the Tauri-free better_fleet_netcap crate (#732), taking the
# winsock2 feature and socket2 with them, so every capture backend now sits behind one interface.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winuser"] }

# x11rb backs the Linux native integration (#731): the Sea of Thieves auto-click (EWMH focus + XTEST
# synthetic input) and keeping the in-game overlay above the game. Pure-Rust connection, so it adds
# no libxcb/libX11 link; the XTEST extension needs its matching feature. Already in the tree as a
# transitive dep of the GTK/wry stack, so this only turns on `xtest` on the shared build. X11-first
# by design (#350) - Wayland forbids synthetic input from an ordinary client - so it is scoped to
# Linux and degrades cleanly when no X server is reachable.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]

# The capture core and its betterfleet-netcap helper live in a sibling crate so the privileged helper
# links only the capture code, never Tauri (#726). Making it a workspace member builds the helper
# binary from this directory (into the shared target dir) and keeps one Cargo.lock for both.
# default-members lists both the app (".") and netcap so a plain `cargo build`/`check`/`test` from
# this directory covers the helper and its unit tests too, not just the app. `cargo run` still targets
# the app via default-run below.
[workspace]
members = ["netcap"]
default-members = [".", "netcap"]
