[package]
name = "better_fleet_netcap"
version = "2.2.2"
description = "Tauri-free capture core and the privilege-separated betterfleet-netcap helper for BetterFleet server detection"
edition = "2021"
rust-version = "1.77.2"

# Kept deliberately clear of the Tauri/GUI stack (#726). This crate and its betterfleet-netcap binary
# are the only code that touches the raw AF_PACKET capture socket, so the privileged helper stays
# tiny: it links just the capture core, socket2, etherparse and serde_json. The GUI (the better_fleet
# package) depends on this crate for the exact same aggregation + ranking; the dependency never flows
# back the other way, which is what keeps Tauri out of the helper.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
etherparse = "0.15.0"
log = "^0.4"

# socket2 backs the Linux AF_PACKET/SOCK_DGRAM capture socket; Domain::PACKET lives behind the `all`
# feature.
[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.5.6", features = ["all"] }

# The Windows backend (#732): the promiscuous SOCK_RAW capture moved here from the GUI crate, so the
# privileged work can run outside the app. socket2 again for Type::RAW (behind `all`), winapi for the
# WSAIoctl(SIO_RCVALL) call that turns the socket promiscuous, and hostname + idna to enumerate the
# local interfaces exactly as the GUI did - punycode included, or a machine with a non-ASCII hostname
# stops capturing. Still no Tauri and no async runtime: that is what keeps this crate hostable by a
# service.
[target.'cfg(windows)'.dependencies]
socket2 = { version = "0.5.6", features = ["all"] }
# winsock2 backs the capture socket; the rest is the capture service's named-pipe transport (#816):
# overlapped I/O so neither end can hang, namedpipeapi/winbase for the pipe itself.
winapi = { version = "0.3.9", features = [
    "winsock2",
    "winbase",
    "sddl",
    "processthreadsapi",
    "namedpipeapi",
    "fileapi",
    "minwinbase",
    "synchapi",
    "ioapiset",
    "handleapi",
    "errhandlingapi",
    "winerror",
    "winnt",
    "minwindef",
] }
hostname = "0.4.0"
idna = "1.0.3"
# SCM glue for the betterfleet-capture-service binary (#816): service entry point, status
# reporting, stop control. Windows-only, so the Linux helper never links it.
windows-service = "0.7.0"

# The privilege-separated capture helper (#726). It holds CAP_NET_RAW so the GUI does not have to.
[[bin]]
name = "betterfleet-netcap"
path = "src/bin/betterfleet_netcap.rs"

# The Windows capture service (#816): the privileged host for the same capture core, registered
# with the SCM because Windows has no per-binary capability - privilege is process context, so the
# host must be a service. The source builds everywhere (a stub main off-Windows) so one workspace
# build covers both CI legs.
[[bin]]
name = "betterfleet-capture-service"
path = "src/bin/betterfleet_capture_service.rs"
