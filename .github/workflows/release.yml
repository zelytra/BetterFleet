name: "Publish"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.0 or v1.2.0). Defaults to latest v* tag."
        required: false
        type: string
      dry_run:
        description: "Build & test everything but publish nothing (no GitHub release, no :latest Docker push, no master sync)."
        required: false
        type: boolean
        default: false

# Never cancel an in-flight release; let it finish publishing. One global lane so a stable tag and a
# lingering RC run cannot race on Docker :latest or the master version bump.
concurrency:
  group: release
  cancel-in-progress: false

# Least privilege by default; the jobs that publish opt into contents: write individually.
permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          fi

          if [ -z "${RAW}" ]; then
            echo "No version found. Push a v* tag or pass workflow_dispatch version input." >&2
            exit 1
          fi

          VERSION="${RAW#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver: ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

          # A pre-release tag carries a semver pre-release suffix (v2.3.0-rc.1). Everything downstream
          # keys off this to keep an RC out of "latest": no updater latest.json, no Docker :latest, no
          # version bump on master.
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

  verify:
    name: Verify (build & test) before publishing
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: mvn test --batch-mode

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Webapp build
        working-directory: webapp
        run: npm ci && npm run build

      - name: Website build
        working-directory: website
        run: npm ci && npm run build

  publish-tauri:
    needs: [resolve-version, verify]
    name: Tauri app
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: webapp
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set version from tag
        working-directory: ${{ github.workspace }}
        run: node .github/scripts/set-version-from-tag.mjs "${{ needs.resolve-version.outputs.tag }}"

      - name: install Rust stable
        # Pinned to a commit (this job holds the updater signing key, so a hijacked action would be able
        # to sign malicious updates). dtolnay/rust-toolchain selects the toolchain from the ref name, so
        # a SHA pin must name the toolchain explicitly.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: webapp/src-tauri

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        # webkit2gtk-4.1 + ayatana are the current Tauri v2 packages (not the v1-era 4.0 / non-ayatana
        # ones). libasound2-dev is for rodio (#671 native countdown audio), which links ALSA at build
        # time and isn't pulled in by the gtk/webkit deps above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libgtk-3-dev libasound2-dev

      - name: install webapp dependencies
        run: npm ci

      - name: Run Rust tests
        working-directory: webapp/src-tauri
        run: cargo test

      - name: Build Tauri app (dry-run, no publish)
        if: ${{ inputs.dry_run }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Skip the post-build strip: it has aborted the Linux bundling on some hosts, and a failed
          # bundle would take the whole publish with it. The packages are a few MB larger as a result.
          NO_STRIP: "true"
        run: npm run tauri:build

      - name: Build & publish Tauri release
        if: ${{ !inputs.dry_run }}
        # v1 tracks Tauri 2 configs (top-level "identifier"); do not pin back to @v0. Pinned to a commit
        # on v1 (this job holds the updater signing key).
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Skip the post-build strip: it has aborted the Linux bundling on some hosts, and a failed
          # bundle would take the whole publish with it. The packages are a few MB larger as a result.
          NO_STRIP: "true"
        with:
          # tauri-action runs from the repo root; point it at the app so its frontend build resolves
          # webapp/node_modules (otherwise `vue-tsc` isn't found on the Linux runner).
          projectPath: webapp
          tagName: v__VERSION__
          releaseName: "BetterFleet v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          # Create the release as a draft: each matrix leg (windows, ubuntu) uploads its own assets to
          # it, and the publish-release job below un-drafts it only once BOTH legs have succeeded. This
          # stops a single failed leg from publishing a "latest" release that is missing the other
          # platform's assets, including the latest.json every installed client polls.
          releaseDraft: true
          # A pre-release tag (v2.3.0-rc.1) publishes a GitHub pre-release: not "latest", so the
          # updater (which reads releases/latest) never serves it to installed apps.
          prerelease: ${{ needs.resolve-version.outputs.prerelease == 'true' }}

  publish-release:
    needs: [resolve-version, publish-tauri]
    # publish-tauri is a matrix; needs waits for every leg, and a dependent job is skipped if any leg
    # failed. So this runs only when BOTH platforms built. It flips the draft the matrix legs created into a real
    # release; if a leg failed it never runs and the release stays a draft (never "latest").
    if: ${{ !inputs.dry_run }}
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
          PRERELEASE: ${{ needs.resolve-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "${PRERELEASE}" = "true" ]; then
            gh release edit "${TAG}" --repo "${{ github.repository }}" --draft=false --prerelease=true --latest=false
          else
            gh release edit "${TAG}" --repo "${{ github.repository }}" --draft=false --prerelease=false --latest=true
          fi

      # tauri-action generates latest.json while the release is still a DRAFT, so its platform
      # URLs point at api.github.com/repos/.../releases/assets/<id> - the only address a draft
      # asset has. That API is rate-limited to 60 unauthenticated requests per hour PER IP, and
      # every installed client downloads its update through it: players behind a shared IP (CGNAT,
      # VPN - a core audience) get 403s and "update failed" for no visible reason. Now that the
      # release is published, every asset has a public releases/download URL served by the CDN
      # with no rate limit: rewrite the manifest to it.
      - name: Point latest.json at the public download URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" --repo "${REPO}" --pattern latest.json --clobber
          gh api "repos/${REPO}/releases/tags/${TAG}" -q '.assets[] | "\(.id) \(.name)"' > assets.map
          python3 - <<'REWRITE'
          import json, os
          ids_to_names = dict(
              line.split(" ", 1)
              for line in open("assets.map").read().strip().splitlines()
          )
          repo, tag = os.environ["REPO"], os.environ["TAG"]
          manifest = json.load(open("latest.json"))
          for platform in manifest["platforms"].values():
              asset_id = platform["url"].rstrip("/").split("/")[-1]
              # Already a public URL (asset name, not a numeric id): nothing to rewrite.
              if asset_id in ids_to_names:
                  name = ids_to_names[asset_id]
                  platform["url"] = f"https://github.com/{repo}/releases/download/{tag}/{name}"
          json.dump(manifest, open("latest.json", "w"), indent=2)
          REWRITE
          gh release upload "${TAG}" --repo "${REPO}" latest.json --clobber

  publish-backend:
    needs: [resolve-version, verify]
    name: Backend app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set version from tag
        run: node .github/scripts/set-version-from-tag.mjs "${{ needs.resolve-version.outputs.tag }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker tags
        id: docker-tags
        run: |
          if [ "${{ needs.resolve-version.outputs.prerelease }}" = "true" ]; then
            # A pre-release tags the RC image only, never overwriting the production :latest.
            echo "tags=zelytra/better-fleet-backend:${{ needs.resolve-version.outputs.tag }}" >> "${GITHUB_OUTPUT}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tags=zelytra/better-fleet-backend:latest,zelytra/better-fleet-backend:${{ needs.resolve-version.outputs.tag }}" >> "${GITHUB_OUTPUT}"
          else
            echo "tags=zelytra/better-fleet-backend:latest" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: backend/
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.docker-tags.outputs.tags }}

  publish-website:
    needs: [resolve-version, verify]
    name: Website app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set version from tag
        run: node .github/scripts/set-version-from-tag.mjs "${{ needs.resolve-version.outputs.tag }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker tags
        id: docker-tags
        run: |
          if [ "${{ needs.resolve-version.outputs.prerelease }}" = "true" ]; then
            # A pre-release tags the RC image only, never overwriting the production :latest.
            echo "tags=zelytra/better-fleet-website:${{ needs.resolve-version.outputs.tag }}" >> "${GITHUB_OUTPUT}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tags=zelytra/better-fleet-website:latest,zelytra/better-fleet-website:${{ needs.resolve-version.outputs.tag }}" >> "${GITHUB_OUTPUT}"
          else
            echo "tags=zelytra/better-fleet-website:latest" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: website/
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.docker-tags.outputs.tags }}

  publish-arch:
    needs: [resolve-version, publish-tauri]
    # Every release, RC included: a direct pacman package (`sudo pacman -U <url>`) is the Arch/CachyOS
    # counterpart of the .deb. Safe on pre-releases: it is served from no repository, so nothing picks
    # an RC up by surprise. Add-on, never a gate on the rest of the release.
    if: ${{ !inputs.dry_run }}
    name: Arch package
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    # makepkg only runs on Arch; base-devel already carries makepkg, fakeroot, sudo and bsdtar.
    container:
      image: archlinux:base-devel
    steps:
      - name: Install git and gh
        run: pacman -Sy --noconfirm --needed git github-cli

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the release .deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${RUNNER_TEMP}/deb"
          gh release download "${{ needs.resolve-version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'BetterFleet_*_amd64.deb' \
            --dir "${RUNNER_TEMP}/deb"

      - name: Build the pacman package from the .deb
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          # pacman pkgver forbids '-'; map the semver pre-release dash to '.' (2.3.0-rc.1 -> 2.3.0.rc.1).
          PKGVER="${VERSION//-/.}"

          DEB=$(find "${RUNNER_TEMP}/deb" -name 'BetterFleet_*_amd64.deb' | head -n1)
          if [ -z "${DEB}" ]; then
            echo "::error::No BetterFleet_*_amd64.deb release asset found to repackage." >&2
            exit 1
          fi
          DEBNAME=$(basename "${DEB}")

          BUILD="${RUNNER_TEMP}/arch"
          mkdir -p "${BUILD}"
          cp "${DEB}" "${BUILD}/"
          cp deployment/aur/betterfleet-bin/betterfleet-bin.install "${BUILD}/"

          # A -bin PKGBUILD that just unpacks this build's .deb (kept in step with the reference
          # PKGBUILD in deployment/aur/betterfleet-bin/; there the source is the release URL, here the
          # local file).
          cat > "${BUILD}/PKGBUILD" <<'PKGBUILD_EOF'
          pkgname=betterfleet-bin
          pkgver=__PKGVER__
          pkgrel=1
          pkgdesc="Companion app for Sea of Thieves that lands your crew on the same server (prebuilt)"
          arch=('x86_64')
          url="https://github.com/zelytra/BetterFleet"
          license=('custom')
          provides=('betterfleet')
          conflicts=('betterfleet')
          install='betterfleet-bin.install'
          depends=('webkit2gtk-4.1' 'gtk3' 'libayatana-appindicator' 'librsvg' 'libcap' 'alsa-lib')
          options=('!strip' '!debug')
          source=('__DEBNAME__')
          sha256sums=('SKIP')
          package() {
            bsdtar -xf "${srcdir}/__DEBNAME__"
            bsdtar -xf data.tar.* -C "${pkgdir}/"
          }
          PKGBUILD_EOF
          sed -i "s/__PKGVER__/${PKGVER}/; s/__DEBNAME__/${DEBNAME}/g" "${BUILD}/PKGBUILD"

          # makepkg refuses to run as root; build as a throwaway unprivileged user. --nodeps: repackaging
          # a .deb needs none of the runtime libs on the runner (they stay recorded for the user's pacman).
          useradd -m builder
          chown -R builder "${BUILD}"
          sudo -u builder bash -c "cd '${BUILD}' && makepkg -f --nodeps --noconfirm"

      - name: Upload the pacman package to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG=$(find "${RUNNER_TEMP}/arch" -maxdepth 1 -name 'betterfleet-bin-*.pkg.tar.zst' | head -n1)
          if [ -z "${PKG}" ]; then
            echo "::error::makepkg produced no .pkg.tar.zst." >&2
            exit 1
          fi
          gh release upload "${{ needs.resolve-version.outputs.tag }}" "${PKG}" \
            --repo "${{ github.repository }}" --clobber

  sync-version-to-master:
    needs:
      - resolve-version
      - publish-tauri
      - publish-release
      - publish-backend
      - publish-website
    # A pre-release must not bump the version on master; only a real release syncs it.
    if: ${{ github.ref_type == 'tag' && needs.resolve-version.outputs.prerelease != 'true' }}
    name: Sync version to master
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          # Push to the protected master branch authenticated as an admin, which bypasses the
          # "require a pull request" rule (enforce_admins is off). Set a RELEASE_PAT secret to a
          # fine-grained PAT (Contents: read/write on this repo) owned by an admin. Falls back to
          # GITHUB_TOKEN when the secret is absent: the push then simply warns instead of syncing.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set version from tag
        run: node .github/scripts/set-version-from-tag.mjs "${{ needs.resolve-version.outputs.tag }}"

      - name: Commit version bump to master
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -uo pipefail
          FILES=(
            webapp/package.json
            webapp/src-tauri/Cargo.toml
            webapp/src-tauri/tauri.conf.json
            backend/src/main/resources/application.properties
            website/package.json
          )

          if git diff --quiet -- "${FILES[@]}"; then
            echo "Version files already up to date on master."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "chore: bump version to ${VERSION} [skip ci]"

          # Pushing to master requires github-actions[bot] to be on the bypass list of master's
          # branch protection AND its ruleset. If the push is rejected, warn and exit 0 so this
          # trailing sync never fails an otherwise-successful release: the version is already
          # correct in every published artifact.
          if git push origin HEAD:master; then
            echo "Pushed version bump to master."
          else
            echo "::warning::Could not push the version bump to master. Add github-actions[bot] to the branch-protection AND ruleset bypass lists to enable it. Version ${VERSION} is already correct in all published artifacts."
          fi
