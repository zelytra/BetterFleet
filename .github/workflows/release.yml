name: "Publish"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.2.0 or v1.2.0). Defaults to latest v* tag."
        required: false
        type: string
      dry_run:
        description: "Build & test everything but publish nothing (no GitHub release, no :latest Docker push, no master sync)."
        required: false
        type: boolean
        default: false

# Never cancel an in-flight release; let it finish publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          fi

          if [ -z "${RAW}" ]; then
            echo "No version found. Push a v* tag or pass workflow_dispatch version input." >&2
            exit 1
          fi

          VERSION="${RAW#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver: ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

          # A pre-release tag carries a semver pre-release suffix (v2.3.0-rc.1). Everything downstream
          # keys off this to keep an RC out of "latest": no updater latest.json, no Docker :latest, no
          # APT publish, no version bump on master.
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

  verify:
    name: Verify (build & test) before publishing
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: mvn test --batch-mode

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Webapp build
        working-directory: webapp
        run: npm ci && npm run build

      - name: Website build
        working-directory: website
        run: npm ci && npm run build

  publish-tauri:
    needs: [resolve-version, verify]
    name: Tauri app
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: webapp
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set version from tag
        working-directory: ${{ github.workspace }}
        run: node .github/scripts/set-version-from-tag.mjs "${{ needs.resolve-version.outputs.tag }}"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: webapp/src-tauri

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        # webkit2gtk-4.1 + ayatana are the current Tauri v2 packages (not the v1-era 4.0 / non-ayatana
        # ones). libasound2-dev is for rodio (#671 native countdown audio), which links ALSA at build
        # time and isn't pulled in by the gtk/webkit deps above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libgtk-3-dev libasound2-dev

      - name: install webapp dependencies
        run: npm ci

      - name: Run Rust tests
        working-directory: webapp/src-tauri
        env:
          BETTERFLEET_TEST_BUILD: "1"
        run: cargo test

      - name: Build Tauri app (dry-run, no publish)
        if: ${{ inputs.dry_run }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # linuxdeploy's strip step aborts the AppImage bundling on some hosts; skipping strip keeps
          # both the .deb and the AppImage building. A failed AppImage would otherwise abort the whole
          # publish, and with it the .deb we actually need.
          NO_STRIP: "true"
        run: npm run tauri:build

      - name: Build & publish Tauri release
        if: ${{ !inputs.dry_run }}
        # v1 tracks Tauri 2 configs (top-level "identifier"); do not pin back to @v0.
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # linuxdeploy's strip step aborts the AppImage bundling on some hosts; skipping strip keeps
          # both the .deb and the AppImage building. A failed AppImage would otherwise abort the whole
          # publish, and with it the .deb we actually need.
          NO_STRIP: "true"
        with:
          # tauri-action runs from the repo root; point it at the app so its frontend build resolves
          # webapp/node_modules (otherwise `vue-tsc` isn't found on the Linux runner).
          projectPath: webapp
          tagName: v__VERSION__
          releaseName: "BetterFleet v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          # A pre-release tag (v2.3.0-rc.1) publishes a GitHub pre-release: not "latest", so the
          # updater (which reads releases/latest) never serves it to installed apps.
          prerelease: ${{ needs.resolve-version.outputs.prerelease == 'true' }}

  publish-backend:
    needs: [resolve-version, verify]
    name: Backend app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set version from tag
        run: node .github/scripts/set-version-from-tag.mjs "${{ needs.resolve-version.outputs.tag }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker tags
        id: docker-tags
        run: |
          if [ "${{ needs.resolve-version.outputs.prerelease }}" = "true" ]; then
            # A pre-release tags the RC image only, never overwriting the production :latest.
            echo "tags=zelytra/better-fleet-backend:${{ needs.resolve-version.outputs.tag }}" >> "${GITHUB_OUTPUT}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tags=zelytra/better-fleet-backend:latest,zelytra/better-fleet-backend:${{ needs.resolve-version.outputs.tag }}" >> "${GITHUB_OUTPUT}"
          else
            echo "tags=zelytra/better-fleet-backend:latest" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: backend/
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.docker-tags.outputs.tags }}

  publish-website:
    needs: [resolve-version, verify]
    name: Website app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set version from tag
        run: node .github/scripts/set-version-from-tag.mjs "${{ needs.resolve-version.outputs.tag }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker tags
        id: docker-tags
        run: |
          if [ "${{ needs.resolve-version.outputs.prerelease }}" = "true" ]; then
            # A pre-release tags the RC image only, never overwriting the production :latest.
            echo "tags=zelytra/better-fleet-website:${{ needs.resolve-version.outputs.tag }}" >> "${GITHUB_OUTPUT}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tags=zelytra/better-fleet-website:latest,zelytra/better-fleet-website:${{ needs.resolve-version.outputs.tag }}" >> "${GITHUB_OUTPUT}"
          else
            echo "tags=zelytra/better-fleet-website:latest" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: website/
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.docker-tags.outputs.tags }}

  publish-apt:
    needs: [resolve-version, publish-tauri]
    # Never publish a pre-release RC to the APT repo, or `apt upgrade` would hand it to everyone.
    if: ${{ !inputs.dry_run && needs.resolve-version.outputs.prerelease != 'true' }}
    name: APT repository
    runs-on: ubuntu-latest
    # Add-on to the Windows/Linux/backend/website publishing above, not a gate for it: never let a
    # missing signing secret (until deployment/apt/README.md's one-time setup is done) or an
    # unexpected failure here fail the release.
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Check required secrets
        id: gate
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "${APT_GPG_PRIVATE_KEY}" ]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::APT_GPG_PRIVATE_KEY is not set, skipping the APT repo publish. See deployment/apt/README.md to configure it."
          fi

      - name: Checkout
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Install reprepro
        if: steps.gate.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg

      - name: Download the release .deb
        if: steps.gate.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${RUNNER_TEMP}/deb"
          gh release download "${{ needs.resolve-version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'BetterFleet_*_amd64.deb' \
            --dir "${RUNNER_TEMP}/deb"

      - name: Import the signing key
        if: steps.gate.outputs.configured == 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 -p "${GNUPGHOME}"
          printf '%s\n' "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import
          printf 'pinentry-mode loopback\n' > "${GNUPGHOME}/gpg.conf"
          printf 'allow-loopback-pinentry\n' > "${GNUPGHOME}/gpg-agent.conf"
          gpgconf --kill gpg-agent || true

          # reprepro shells out to `gpg` non-interactively; priming the agent's passphrase cache
          # here (with a throwaway signature) lets that later call succeed without a prompt. Keys
          # created without a passphrase (the README's recommendation) skip this - nothing to cache.
          if [ -n "${APT_GPG_PASSPHRASE}" ]; then
            KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')
            printf 'priming the agent\n' | gpg --batch --pinentry-mode loopback \
              --passphrase "${APT_GPG_PASSPHRASE}" --local-user "${KEY_ID}" \
              --detach-sign --output /dev/null
          fi

          echo "GNUPGHOME=${GNUPGHOME}" >> "${GITHUB_ENV}"

      - name: Update and publish the repo
        if: steps.gate.outputs.configured == 'true'
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          set -euo pipefail
          WORKTREE="${RUNNER_TEMP}/gh-pages"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git clone --branch gh-pages --single-branch --depth 1 "${REPO_URL}" "${WORKTREE}" 2>/dev/null; then
            echo "Checked out the existing gh-pages branch."
          else
            echo "No gh-pages branch yet — this run creates it."
            mkdir -p "${WORKTREE}"
            git -C "${WORKTREE}" init --initial-branch=gh-pages --quiet
            git -C "${WORKTREE}" remote add origin "${REPO_URL}"
          fi

          # Pages serves this branch's root through Jekyll by default; the repo is plain static
          # files, not a Jekyll site, so opt out at the root (publish.sh adds its own inside apt/
          # too, which matters if REPO_DIR is ever pointed at a Pages root directly instead).
          touch "${WORKTREE}/.nojekyll"

          DEB_FILE=$(find "${RUNNER_TEMP}/deb" -name 'BetterFleet_*_amd64.deb' | head -n1)
          if [ -z "${DEB_FILE}" ]; then
            echo "::error::No BetterFleet_*_amd64.deb release asset found to publish." >&2
            exit 1
          fi

          bash deployment/apt/publish.sh "${DEB_FILE}" "${WORKTREE}/apt"

          cd "${WORKTREE}"
          git add -A
          if git diff --cached --quiet; then
            echo "APT repo already up to date, nothing to publish."
          else
            git commit -m "apt: publish ${TAG}" --quiet
            git push origin HEAD:gh-pages
          fi

  publish-arch:
    needs: [resolve-version, publish-tauri]
    # Every release, RC included: a direct pacman package (`sudo pacman -U <url>`) is the Arch/CachyOS
    # counterpart of the .deb. Unlike the AUR publish below it is safe on pre-releases (nobody's
    # `paru -S` picks it up by surprise). Add-on, never a gate on the rest of the release (#740).
    if: ${{ !inputs.dry_run }}
    name: Arch package
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    # makepkg only runs on Arch; base-devel already carries makepkg, fakeroot, sudo and bsdtar.
    container:
      image: archlinux:base-devel
    steps:
      - name: Install git and gh
        run: pacman -Sy --noconfirm --needed git github-cli

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the release .deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${RUNNER_TEMP}/deb"
          gh release download "${{ needs.resolve-version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'BetterFleet_*_amd64.deb' \
            --dir "${RUNNER_TEMP}/deb"

      - name: Build the pacman package from the .deb
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          # pacman pkgver forbids '-'; map the semver pre-release dash to '.' (2.3.0-rc.1 -> 2.3.0.rc.1).
          PKGVER="${VERSION//-/.}"

          DEB=$(find "${RUNNER_TEMP}/deb" -name 'BetterFleet_*_amd64.deb' | head -n1)
          if [ -z "${DEB}" ]; then
            echo "::error::No BetterFleet_*_amd64.deb release asset found to repackage." >&2
            exit 1
          fi
          DEBNAME=$(basename "${DEB}")

          BUILD="${RUNNER_TEMP}/arch"
          mkdir -p "${BUILD}"
          cp "${DEB}" "${BUILD}/"
          cp deployment/aur/betterfleet-bin/betterfleet-bin.install "${BUILD}/"

          # A -bin PKGBUILD that just unpacks this build's .deb (kept in step with the AUR template in
          # deployment/aur/betterfleet-bin/; there the source is the release URL, here the local file).
          cat > "${BUILD}/PKGBUILD" <<'PKGBUILD_EOF'
          pkgname=betterfleet-bin
          pkgver=__PKGVER__
          pkgrel=1
          pkgdesc="Companion app for Sea of Thieves that lands your crew on the same server (prebuilt)"
          arch=('x86_64')
          url="https://github.com/zelytra/BetterFleet"
          license=('custom')
          provides=('betterfleet')
          conflicts=('betterfleet')
          install='betterfleet-bin.install'
          depends=('webkit2gtk-4.1' 'gtk3' 'libayatana-appindicator' 'librsvg' 'libcap')
          options=('!strip' '!debug')
          source=('__DEBNAME__')
          sha256sums=('SKIP')
          package() {
            bsdtar -xf "${srcdir}/__DEBNAME__"
            bsdtar -xf data.tar.* -C "${pkgdir}/"
          }
          PKGBUILD_EOF
          sed -i "s/__PKGVER__/${PKGVER}/; s/__DEBNAME__/${DEBNAME}/g" "${BUILD}/PKGBUILD"

          # makepkg refuses to run as root; build as a throwaway unprivileged user. --nodeps: repackaging
          # a .deb needs none of the runtime libs on the runner (they stay recorded for the user's pacman).
          useradd -m builder
          chown -R builder "${BUILD}"
          sudo -u builder bash -c "cd '${BUILD}' && makepkg -f --nodeps --noconfirm"

      - name: Upload the pacman package to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG=$(find "${RUNNER_TEMP}/arch" -maxdepth 1 -name 'betterfleet-bin-*.pkg.tar.zst' | head -n1)
          if [ -z "${PKG}" ]; then
            echo "::error::makepkg produced no .pkg.tar.zst." >&2
            exit 1
          fi
          gh release upload "${{ needs.resolve-version.outputs.tag }}" "${PKG}" \
            --repo "${{ github.repository }}" --clobber

  publish-aur:
    needs: [resolve-version, publish-tauri]
    # Only stable goes to the public AUR: an RC would hand `paru -S betterfleet-bin` a pre-release to
    # every Arch user. Add-on, never a gate on the release, and a no-op until the AUR SSH key is
    # configured (see deployment/aur/README.md), exactly like the APT publish's GPG secret. Unlike the
    # publish-arch package attached to every release, this one goes to third-party infrastructure.
    if: ${{ !inputs.dry_run && needs.resolve-version.outputs.prerelease != 'true' }}
    name: AUR package
    runs-on: ubuntu-latest
    continue-on-error: true
    # makepkg --printsrcinfo only runs on Arch; base-devel already carries makepkg, sudo and bsdtar.
    container:
      image: archlinux:base-devel
    steps:
      - name: Check required secret
        id: gate
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::AUR_SSH_PRIVATE_KEY is not set, skipping the AUR publish. See deployment/aur/README.md to configure it."
          fi

      - name: Install git, gh and openssh
        if: steps.gate.outputs.configured == 'true'
        run: pacman -Sy --noconfirm --needed git github-cli openssh

      - name: Checkout
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Pin the PKGBUILD to this release and render .SRCINFO
        if: steps.gate.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"

          mkdir -p "${RUNNER_TEMP}/deb"
          gh release download "${{ needs.resolve-version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'BetterFleet_*_amd64.deb' \
            --dir "${RUNNER_TEMP}/deb"
          DEB=$(find "${RUNNER_TEMP}/deb" -name 'BetterFleet_*_amd64.deb' | head -n1)
          if [ -z "${DEB}" ]; then
            echo "::error::No BetterFleet_*_amd64.deb release asset found." >&2
            exit 1
          fi
          SHA=$(sha256sum "${DEB}" | cut -d' ' -f1)

          WORK="${RUNNER_TEMP}/aur"
          mkdir -p "${WORK}"
          cp deployment/aur/betterfleet-bin/PKGBUILD "${WORK}/"
          cp deployment/aur/betterfleet-bin/betterfleet-bin.install "${WORK}/"
          # Pin the template (source URL is versioned, sha256 replaces the SKIP the local .pkg.tar.zst
          # build uses); makepkg then derives the .SRCINFO the AUR requires alongside the PKGBUILD.
          sed -i \
            -e "s/^pkgver=.*/pkgver=${VERSION}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('${SHA}')/" \
            "${WORK}/PKGBUILD"

          # makepkg refuses to run as root; use a throwaway unprivileged user.
          useradd -m builder
          chown -R builder "${WORK}"
          sudo -u builder bash -c "cd '${WORK}' && makepkg --printsrcinfo > .SRCINFO"

      - name: Push to the AUR
        if: steps.gate.outputs.configured == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n' > ~/.ssh/config
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory '*'

          REPO="${RUNNER_TEMP}/aur-repo"
          # A never-published package clones as an empty repo; the first push creates it.
          git clone ssh://aur@aur.archlinux.org/betterfleet-bin.git "${REPO}"
          cp "${RUNNER_TEMP}/aur/PKGBUILD" "${RUNNER_TEMP}/aur/.SRCINFO" \
             "${RUNNER_TEMP}/aur/betterfleet-bin.install" "${REPO}/"
          cd "${REPO}"
          git add -A
          if git diff --cached --quiet; then
            echo "AUR already up to date for ${VERSION:-this release}."
          else
            git commit -m "betterfleet-bin ${{ needs.resolve-version.outputs.version }}"
            git push origin HEAD:master
          fi

  sync-version-to-master:
    needs:
      - resolve-version
      - publish-tauri
      - publish-backend
      - publish-website
    # A pre-release must not bump the version on master; only a real release syncs it.
    if: ${{ github.ref_type == 'tag' && needs.resolve-version.outputs.prerelease != 'true' }}
    name: Sync version to master
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          # Push to the protected master branch authenticated as an admin, which bypasses the
          # "require a pull request" rule (enforce_admins is off). Set a RELEASE_PAT secret to a
          # fine-grained PAT (Contents: read/write on this repo) owned by an admin. Falls back to
          # GITHUB_TOKEN when the secret is absent: the push then simply warns instead of syncing.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set version from tag
        run: node .github/scripts/set-version-from-tag.mjs "${{ needs.resolve-version.outputs.tag }}"

      - name: Commit version bump to master
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -uo pipefail
          FILES=(
            webapp/package.json
            webapp/src-tauri/Cargo.toml
            webapp/src-tauri/tauri.conf.json
            backend/src/main/resources/application.properties
            website/package.json
          )

          if git diff --quiet -- "${FILES[@]}"; then
            echo "Version files already up to date on master."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "chore: bump version to ${VERSION} [skip ci]"

          # Pushing to master requires github-actions[bot] to be on the bypass list of master's
          # branch protection AND its ruleset. If the push is rejected, warn and exit 0 so this
          # trailing sync never fails an otherwise-successful release: the version is already
          # correct in every published artifact.
          if git push origin HEAD:master; then
            echo "Pushed version bump to master."
          else
            echo "::warning::Could not push the version bump to master. Add github-actions[bot] to the branch-protection AND ruleset bypass lists to enable it. Version ${VERSION} is already correct in all published artifacts."
          fi
