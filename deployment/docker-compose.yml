# No `version:` key: obsolete since Compose v2, and it earns a warning on every command.
name: betterfleet

# Cap container logs so they can never fill the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres-app:
    image: postgres:14-alpine
    container_name: betterfleet-postgres-app
    # Loopback-only: the backend reaches this over the compose network (DB_HOST: postgres-app).
    # The host port stays for local admin (psql / SSH tunnel) without exposing the DB to the internet.
    ports:
      - "127.0.0.1:2600:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./psql-data/app:/var/lib/postgresql/betterfleet/data/pgdata
      - /etc/localtime:/etc/localtime:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: BetterFleet
      PGDATA: /var/lib/postgresql/betterfleet/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d BetterFleet"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  backend:
    image: zelytra/better-fleet-backend:latest
    container_name: betterfleet-backend
    # Hairpin NAT: the box can't reach its own public IP, so betterfleet.fr must resolve to the LAN
    # address inside the backend, or its OIDC discovery to https://betterfleet.fr/auth fails (#655).
    # Backend only; set this to the host's LAN address.
    extra_hosts:
      - "betterfleet.fr:192.168.1.103"
    depends_on:
      # Not the short form: that only waits for Keycloak's *container* to start, and Keycloak needs
      # a further ~15s before it answers. The backend was doing OIDC discovery in that window, got a
      # 502, and booted with the Default tenant uninitialised (see issue #629).
      keycloak:
        condition: service_healthy
      postgres-app:
        condition: service_healthy
    # Loopback-only: only the host's edge nginx (proxy_pass 127.0.0.1:2601) needs to reach it.
    ports:
      - "127.0.0.1:2601:8080"
    environment:
      DB_HOST: postgres-app
      DB_DATABASE: BetterFleet
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_HOST: ${PUBLIC_KEYCLOAK_HOSTNAME}
      PROXY_CHECK_API_KEY: ${PROXY_CHECK_API_KEY}
      # Optional: a fine-grained GitHub token (public repositories, read-only) so the release proxy
      # gets 5000 req/h instead of the anonymous 60/h shared by everything on the server's IP.
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      # Optional: Discord webhook pinged (fire-and-forget) whenever a bug report is submitted.
      # Empty = notifications off; the report endpoint behaves identically either way.
      DISCORD_REPORT_WEBHOOK_URL: ${DISCORD_REPORT_WEBHOOK_URL:-}
    healthcheck:
      # No curl/wget in the UBI OpenJDK image; /bin/sh is bash, so probe the "/" (Pong!) endpoint
      # over /dev/tcp like the Keycloak check does.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: unless-stopped

  frontend:
    image: zelytra/better-fleet-website:latest
    container_name: betterfleet-website
    depends_on:
      keycloak:
        condition: service_started
      postgres-app:
        condition: service_started
      backend:
        condition: service_healthy
    # Loopback-only: only the host's edge nginx (proxy_pass 127.0.0.1:2602) needs to reach it.
    ports:
      - "127.0.0.1:2602:80"
    environment:
      VITE_BACKEND_HOST: ${PUBLIC_QUARKUS_HOSTNAME}
      VITE_KEYCLOAK_HOST: ${PUBLIC_KEYCLOAK_HOSTNAME}
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 192M
    restart: unless-stopped

  postgres-auth:
    image: postgres:14-alpine
    container_name: betterfleet-postgres-auth
    ports:
      - "127.0.0.1:2603:5432"
    volumes:
      - ./psql-data/auth:/var/lib/postgresql/data/pgdata
      - /etc/localtime:/etc/localtime:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: Keycloak
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d Keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: betterfleet-keycloak
    depends_on:
      - postgres-auth
    # Probes the one thing the backend actually needs: the Betterfleet realm's discovery document
    # being served. That is stricter than a port check or /health/ready: an unimported realm answers
    # 404 on this URL while the port is wide open, and it is a 200 here that lets the backend boot
    # with its tenant initialised.
    #
    # Written against /dev/tcp because this image ships no curl, no wget and no nc: verified, along
    # with /bin/sh being a symlink to bash, which is what makes /dev/tcp available to CMD-SHELL at
    # all. Enabling KC_HEALTH_ENABLED would be the other route; it would need extra config and would
    # only tell us Keycloak is up, not that the realm is there.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /auth/realms/Betterfleet/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 20
      # Measured at ~12s to import the realm and serve on this host; 60s leaves room for a cold,
      # loaded production box without ever marking a healthy Keycloak as failed.
      start_period: 60s
    # Loopback-only: only the host's edge nginx (proxy_pass 127.0.0.1:2604) needs to reach it.
    ports:
      - "127.0.0.1:2604:8080"
    volumes:
      - ./keycloak/config:/opt/keycloak/data/import
      - ./keycloak/themes/betterfleet:/opt/keycloak/themes/betterfleet
      - /etc/localtime:/etc/localtime:ro
    command: start --import-realm
    environment:
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-auth
      PROXY_ADDRESS_FORWARDING: "true"
      KC_PROXY: edge
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      KC_DB_URL_DATABASE: Keycloak
      KC_VAULT_FILE: /var/keycloak/vault
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KC_OVERRIDE: "false"
      # Pin the heap in absolute terms (issue #711). The image sizes it as a percentage of "available
      # memory", which the JVM reads from the cgroup limit when there is one and from /proc/meminfo
      # otherwise. This is an LXC-style Proxmox guest where /proc/meminfo is NOT namespaced: the
      # container reads the hypervisor's 62 GiB, so the default -XX:MaxRAMPercentage=70 resolved to a
      # 43 GiB max heap on a 15.6 GiB box. ParallelGC is tuned to grow rather than collect while it
      # believes memory is free, so it expanded eden until the host ran out, measured at +0.15 GiB/h
      # with no plateau, 57 MiB of live data behind 7.4 GiB of RSS. Setting JAVA_OPTS_KC_HEAP
      # replaces the InitialRAMPercentage/MaxRAMPercentage/MinRAMPercentage trio outright, which is
      # what actually removes the dependency on that bogus reading. Never size this by percentage here.
      JAVA_OPTS_KC_HEAP: "-Xms512m -Xmx2g -XX:MaxMetaspaceSize=256m"
    logging: *default-logging
    deploy:
      resources:
        limits:
          # Backstop only, and deliberately well clear of the 2 GiB heap above. A tight limit here is
          # its own failure mode: `start --import-realm` runs the kc.sh build augmentation at boot,
          # and a 2 GiB limit (2026-07-21) OOM-killed the container during startup. The 1536M this
          # replaces was tighter still: it only ever worked because production had not yet pulled it.
          memory: 4G
    restart: unless-stopped

  # Scheduled logical backups of both databases (#860). Before this, the only copy of production
  # data was the pgdata directory itself, plus one hand-made tarball that was a month stale - and a
  # tarball of a running pgdata is not a restorable backup anyway.
  #
  # A loop in a tiny container rather than a host cron: the compose file is what self-hosters
  # deploy, so the backup has to travel with it. It needs no host tooling, it reaches both
  # databases over the compose network, and it survives a host reboot through `restart:
  # unless-stopped` like everything else here.
  backup:
    image: postgres:14-alpine
    container_name: betterfleet-backup
    depends_on:
      postgres-app:
        condition: service_healthy
      postgres-auth:
        condition: service_healthy
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      # Bind-mounted so the dumps are visible on the host for off-site copying - which is the part
      # this cannot do for you: a backup on the same disk as the database survives a bad command,
      # not a dead disk. Copy ./backups off the box (rsync, provider snapshot, anything) and the
      # story is complete.
      - ./backups:/backups
      - /etc/localtime:/etc/localtime:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      # pg_dump reads the password from the environment; it never appears in an argv a `ps` shows.
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    # Dump once at start (so a fresh deploy has a backup within seconds, not tomorrow), then every
    # interval. `sh -c` with a sleep loop instead of cron: no crond in this image, no log plumbing
    # to invent, and the output lands in `docker logs betterfleet-backup` like every other service.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          # Invoked through `sh` rather than executed: a bind mount that loses the executable bit
          # (a checkout on a filesystem without exec permissions, an archive extraction) would
          # otherwise fail every run with "permission denied" - caught in the local end-to-end test.
          sh /backup.sh || echo "[backup] run failed; retrying at the next interval" >&2
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

# The histeria.fr uplink has a reduced path MTU; Docker's default 1500-byte bridge MTU makes
# container TLS handshakes stall for several seconds. Pin the bridge MTU to 1420 to match the link.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1420"
